<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Favicon variant: heavier strokes and less padding than logo.svg, because
    the full mark's proportions go muddy below ~48px. The ink colour flips
    with the browser theme so the mark does not disappear in a dark tab strip.
  -->
  <style>
    .ink { fill: #121115; }
    @media (prefers-color-scheme: dark) { .ink { fill: #f1efe9; } }
  </style>
  <g class="ink">
    <path d="M4 4 H46 V22 H22 V46 H4 Z"/>
    <path d="M54 4 H96 V46 H78 V22 H54 Z"/>
    <path d="M4 54 H22 V78 H46 V96 H4 Z"/>
    <path d="M78 54 H96 V96 H54 V78 H78 Z"/>
    <path d="M22 28 H46 L78 60 V78 H54 L22 46 Z"/>
  </g>
  <rect x="62" y="26" width="12" height="12" fill="#c4271a"/>
</svg>
